name: John Fry Studio — guarded candidate checks
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Site or marketplace identifier"
        required: true
        default: "marketplace"
      change_id:
        description: "Approved work item ID"
        required: true
      candidate_sha:
        description: "Exact main commit to test (40 hex characters)"
        required: true
permissions:
  contents: read
concurrency:
  group: john-fry-studio
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: validate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CHANGE_ID: ${{ inputs.change_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'Invalid commit SHA'; exit 1; }
          [[ "$CHANGE_ID" =~ ^[a-zA-Z0-9._-]{3,80}$ ]] || { echo 'Invalid change ID'; exit 1; }
          test -s AGENTS.md
          test -s agents/john-fry/PERSONA.md
          test -s docs/CINEMATIC_INTELLIGENCE_LUXURY.md
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
  verify:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Discover and execute project checks
        id: checks
        env:
          TARGET: ${{ inputs.target }}
          CHANGE_ID: ${{ inputs.change_id }}
          CANDIDATE_SHA: ${{ needs.preflight.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/john-fry/verify.mjs
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-fry-checks-${{ github.run_id }}
          path: artifacts/john-fry/
          if-no-files-found: warn
  # No deploy job. Candidate SHA approval and owner-controlled deployment are
  # intentionally separate; no AI credential or production secret is exposed.
