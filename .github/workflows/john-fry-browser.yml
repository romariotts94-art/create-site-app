name: John Fry — browser QA and visual evidence
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'scripts/john-fry/browser-qa.mjs'
      - '.github/workflows/john-fry-browser.yml'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character commit SHA from main"
        required: false
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate is in main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git checkout --detach "$CANDIDATE_SHA"
          test -s dist/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/john-fry
          python3 -m http.server 8765 --directory dist >/tmp/john-fry-server.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS http://127.0.0.1:8765/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/john-fry/browser-qa.mjs
      - name: Upload screenshots and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: john-fry-browser-evidence-${{ github.run_id }}
          path: artifacts/john-fry/
          retention-days: 14
          if-no-files-found: warn
  # No deployment; explicit owner approval still required.
