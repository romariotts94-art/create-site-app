name: John Fry — static preview artifact
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact commit SHA from main"
        required: true
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate and static entry point
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || exit 1
          git cat-file -e "${CANDIDATE_SHA}^{commit}"
          git merge-base --is-ancestor "$CANDIDATE_SHA" origin/main
          git checkout --detach "$CANDIDATE_SHA"
          test -s dist/index.html
          test -s dist/catalog-app.js
          test -s dist/production-layer.js
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*.js; do
            node --check "$file"
          done
      - name: Start static server and smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory dist >/tmp/john-fry-http.log 2>&1 &
          echo $! >/tmp/john-fry-http.pid
          trap 'kill "$(cat /tmp/john-fry-http.pid)" || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:8765/ -o /tmp/john-fry-index.html; then break; fi
            sleep 1
          done
          grep -qi '<html' /tmp/john-fry-index.html
          curl --fail --silent http://127.0.0.1:8765/catalog-app.js >/dev/null
          curl --fail --silent http://127.0.0.1:8765/production-layer.js >/dev/null
      - name: Upload candidate preview files
        uses: actions/upload-artifact@v4
        with:
          name: john-fry-preview-${{ github.run_id }}
          path: dist/
          retention-days: 14
      # This artifact is NOT a live URL. No GitHub Pages or production deployment.
      # Owner must explicitly approve an exact SHA before any publication.
