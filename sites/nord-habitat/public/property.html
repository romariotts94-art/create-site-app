<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Квартира — Nord Habitat</title><link rel="stylesheet" href="styles.css"></head><body><header class="nh-header"><a class="nh-logo" href="index.html"><span>◆</span> nord <b>habitat</b></a><nav><a href="catalog.html">Квартиры</a><a href="projects.html">Проекты</a><a href="index.html#districts">Районы</a><a href="index.html#services">Сервисы</a><a href="journal.html">Журнал</a></nav><a class="login-btn" href="account.html">Войти</a></header><main class="section"><a class="text-link" href="catalog.html">← Вернуться в каталог</a><div id="property"></div></main><script>const homes=[{id:1,title:'Двухкомнатная с видом на реку',project:'Северный берег',area:64,rooms:2,price:19800000,metro:'Фили',tag:'Панорамный вид'},{id:2,title:'Семейная квартира с террасой',project:'Лесной код',area:92,rooms:3,price:28900000,metro:'Раменки',tag:'Терраса'},{id:3,title:'Пентхаус на верхнем этаже',project:'Высота 17',area:126,rooms:4,price:46800000,metro:'Кутузовская',tag:'Вид на город'},{id:4,title:'Светлая евро-трёшка',project:'Северный берег',area:78,rooms:3,price:24100000,metro:'Фили',tag:'Готовая отделка'}];const home=homes.find(x=>x.id===Number(new URLSearchParams(location.search).get('id')||1))||homes[0];const money=(n)=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';document.querySelector('#property').innerHTML=`<p class="eyebrow blue">${home.project} · ${home.metro}</p><h1>${home.title}</h1><p class="hero-copy" style="color:#718096">${home.area} м² · ${home.rooms} комнаты · ${home.tag}</p><div class="finance-card"><div><h3>${money(home.price)}</h3><p>Панорамный свет, продуманная планировка и сценарий жизни рядом с парком.</p><button class="primary-btn" onclick="alert('Демо: запрос отправлен эксперту')">Задать вопрос ↗</button></div><div><h3>Полная стоимость</h3><p>Первоначальный взнос: 30%</p><p>Ориентир платежа: ${money(Math.round(home.price*.7*.18/12))} / месяц</p><button class="primary-btn" onclick="alert('Демо: квартира добавлена в сравнение')">Сравнить квартиру ↗</button></div></div>`;</script></body></html>
